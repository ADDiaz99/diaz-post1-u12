name: Validacion Arquitectonica

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  arquitectura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Java 17 es la version que declara el pom (java.version): si compila y pasa aqui,
      # sirve en cualquier maquina con Java 17 o superior.
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Ejecutar reglas de arquitectura
        run: mvn test -Dtest=ReglasArquitectura --no-transfer-progress

      - name: Ejecutar suite completa de pruebas
        run: mvn verify --no-transfer-progress
